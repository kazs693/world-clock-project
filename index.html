<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock Project - Karen Searle</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>

      <select name="" id="city">
        <option>Choose city...</option>
        <option value="Europe/Brussels">Brussels 🦁</option>
        <option value="Asia/Kathmandu">Kathmandu 🐮</option>
        <option value="Antarctica/South_Pole">South Pole 🐧</option>
      </select>

      <div id="cities">
        <div class="city" id="melbourne">
          <div>
            <h2>Melbourne 🦘</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
        <div class="city" id="lisbon">
          <div>
            <h2>Lisbon 🐺</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
      </div>
    </div>
    <footer>
      This project was coded with 💙 by
      <a href="https://github.com/kazs693" target="_blank">Karen Searle</a>
      and is open-sourced on
      <a href="https://github.com/kazs693/world-clock-project" target="_blank"
        >Github</a
      >, and hosted on
      <a href="https://world-clock-project-kazs693.netlify.app/" target="_blank"
        >Netlify</a
      >
    </footer>

    <script src="javascript/index.js"></script>
  </body>
</html>
